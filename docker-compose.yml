services:
  tkd_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: escuela_taekwondo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  tkd_pagos:
    image: bitnami/laravel:latest
    working_dir: /app
    entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8002:8000"
    volumes:
      - ./tkd_pagos:/app
    environment:
      APP_URL: http://localhost:8002
      POS_URL: http://tkd_pos:8000
      POS_PUBLIC_URL: http://localhost:8003
      PAGO_SECRET: ${PAGO_SECRET:-tkd-dev-pago-secret}
    depends_on:
      - tkd_db
      - tkd_pos

  tkd_alumnos:
    image: bitnami/laravel:latest
    working_dir: /app
    entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8001:8000"
    volumes:
      - ./tkd_alumnos:/app
    depends_on:
      - tkd_db

  tkd_pos:
    image: bitnami/laravel:latest
    working_dir: /app
    entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8003:8000"
    volumes:
      - ./tkd_pos:/app
    environment:
      PAGOS_URL: http://localhost:8002
      PAGO_SECRET: ${PAGO_SECRET:-tkd-dev-pago-secret}
      APP_URL: http://localhost:8003
    depends_on:
      - tkd_db

volumes:
  db_data:
